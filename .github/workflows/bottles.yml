name: Build Homebrew bottles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already published in the tap (without v)
        required: true
        type: string
permissions:
  contents: read
jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Validate stable version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'macos-26-intel'
        with:
          toolchain: 1.98.1
      - name: Build and test the published formula
        shell: bash
        run: |
          brew update
          brew tap olliejudge/tap
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula olliejudge/tap/dsmactools
          fi
          formula_version=$(brew info --json=v2 olliejudge/tap/dsmactools | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["versions"]["stable"]')
          test "$formula_version" = "$RELEASE_VERSION"
          brew audit --strict --online olliejudge/tap/dsmactools
          if [ "$(uname -m)" = x86_64 ]; then
            # Homebrew no longer publishes Intel Rust dependency bottles.
            # Use the pinned compiler above; this app has no runtime dependencies.
            brew install --build-bottle --ignore-dependencies olliejudge/tap/dsmactools
          else
            brew install --build-bottle olliejudge/tap/dsmactools
          fi
          brew test olliejudge/tap/dsmactools
          mkdir bottle-output
          cd bottle-output
          brew bottle --json --no-rebuild --root-url "https://github.com/olliejudge/dsmactools/releases/download/v$RELEASE_VERSION" olliejudge/tap/dsmactools
      - name: Publish bottle and checksum metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: bottle-output
        run: |
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          # Homebrew's local filename uses --; its download URL uses -.
          for file in ./dsmactools--*.bottle.tar.gz; do
            mv "$file" "${file/--/-}"
          done
          archives=(./dsmactools-*.bottle.tar.gz)
          metadata=(./dsmactools--*.bottle.json)
          archive_name="${archives[0]##*/}"
          metadata_name="${metadata[0]##*/}"
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
          archive_exists=$(ruby -e 'puts File.readlines(ARGV[0], chomp: true).include?(ARGV[1])' existing-assets.txt "$archive_name")
          metadata_exists=$(ruby -e 'puts File.readlines(ARGV[0], chomp: true).include?(ARGV[1])' existing-assets.txt "$metadata_name")
          if [ "$archive_exists" = true ] && [ "$metadata_exists" = true ]; then
            echo "Retaining the previously published immutable bottle and metadata."
          elif [ "$archive_exists" = true ] || [ "$metadata_exists" = true ]; then
            echo "Incomplete existing bottle pair; review it before retrying."
            exit 1
          else
            gh release upload "v$RELEASE_VERSION" "${archives[0]}" "${metadata[0]}" --repo "$GITHUB_REPOSITORY"
          fi
