name: Build Homebrew bottles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already published in the tap (without v)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Validate stable version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: 1.98.1
      - name: Build and test the published formula
        shell: bash
        run: |
          brew update
          brew tap olliejudge/tap
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula olliejudge/tap/dsmactools
          fi
          formula_version=$(brew info --json=v2 olliejudge/tap/dsmactools | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["versions"]["stable"]')
          test "$formula_version" = "$RELEASE_VERSION"
          brew audit --strict --online olliejudge/tap/dsmactools
          # Homebrew publishes Rust bottles only for its newest platform, so a
          # dependency install would compile Rust from source. Use the pinned
          # compiler above; this app has no runtime dependencies.
          # Homebrew isolates HOME, so use real binaries rather than rustup proxies.
          toolchain_bin=$(dirname "$(rustup which --toolchain 1.98.1 cargo)")
          export PATH="$toolchain_bin:$PATH"
          cargo --version
          rustc --version
          brew install --build-bottle --ignore-dependencies olliejudge/tap/dsmactools
          brew test olliejudge/tap/dsmactools
          mkdir bottle-output
          cd bottle-output
          brew bottle --json --no-rebuild --root-url "https://github.com/olliejudge/dsmactools/releases/download/v$RELEASE_VERSION" olliejudge/tap/dsmactools
          # Homebrew's local filename uses --; its download URL uses -.
          for file in ./dsmactools--*.bottle.tar.gz; do
            mv "$file" "${file/--/-}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.os }}
          path: |
            bottle-output/dsmactools-*.bottle.tar.gz
            bottle-output/dsmactools--*.bottle.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate stable version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          merge-multiple: true
          path: bottle-output
      - name: Publish bottles and checksum metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: bottle-output
        run: |
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
          archives=(./dsmactools-*.bottle.tar.gz)
          test -e "${archives[0]}"
          test "${#archives[@]}" -eq 4
          for archive in "${archives[@]}"; do
            archive_name="${archive##*/}"
            # Metadata keeps Homebrew's local -- spelling.
            metadata_name="${archive_name/dsmactools-/dsmactools--}"
            metadata_name="${metadata_name%.tar.gz}.json"
            test -f "./$metadata_name"
            archive_exists=$(ruby -e 'puts File.readlines(ARGV[0], chomp: true).include?(ARGV[1])' existing-assets.txt "$archive_name")
            metadata_exists=$(ruby -e 'puts File.readlines(ARGV[0], chomp: true).include?(ARGV[1])' existing-assets.txt "$metadata_name")
            if [ "$archive_exists" = true ] && [ "$metadata_exists" = true ]; then
              echo "Retaining the previously published immutable bottle and metadata: $archive_name"
            elif [ "$archive_exists" = true ] || [ "$metadata_exists" = true ]; then
              echo "Incomplete existing bottle pair for $archive_name; review it before retrying."
              exit 1
            else
              gh release upload "v$RELEASE_VERSION" "./$archive_name" "./$metadata_name" --repo "$GITHUB_REPOSITORY"
            fi
          done
