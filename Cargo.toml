[package]
name = "ds-mac-tools"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "An interactive macOS toolkit for DualSense controller firmware"
repository = "https://github.com/olliejudge/dsmactools"
homepage = "https://github.com/olliejudge/dsmactools"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hidapi = "2.6"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde_json = "1"
sha2 = "0.10"

console = "0.16"
dialoguer = { version = "0.12", default-features = false }
indicatif = "0.18"
